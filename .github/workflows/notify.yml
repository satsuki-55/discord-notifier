name: Discord Notifier

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run notifier
        run: python3 notify.py
        env:
          DISCORD_WEBHOOK_QUIZKNOCK: ${{ secrets.DISCORD_WEBHOOK_QUIZKNOCK }}
          DISCORD_WEBHOOK_MAGUROHEAD: ${{ secrets.DISCORD_WEBHOOK_MAGUROHEAD }}
          DISCORD_WEBHOOK_BBC: ${{ secrets.DISCORD_WEBHOOK_BBC }}
          DISCORD_WEBHOOK_NHK: ${{ secrets.DISCORD_WEBHOOK_NHK }}
          DISCORD_WEBHOOK_GIZMODO: ${{ secrets.DISCORD_WEBHOOK_GIZMODO }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update notification state"
            git push
          fi
